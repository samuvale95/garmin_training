# Esempio: una seduta di corsa e una di calisthenics.
# Importalo da Piano → Programmi → Importa un file (o incollalo nel riquadro).
#
# Regole del formato:
#   date            AAAA-MM-GG
#   sport           running | cycling | swimming | strength_training | calisthenics | other
#   priority        key (seduta chiave) | flexible (spostabile)
#   steps.type      warmup | interval | recovery | rest | cooldown
#   duration_type   time (minuti) | distance (km) | reps (ripetizioni)
#   reps            scorciatoia: "reps: 6" equivale a duration_type reps, duration_value 6
#   exercise        esercizio del catalogo Garmin (PULL_UP, PUSH_UP, BODY_WEIGHT_DIP…)
#                   o un nome italiano comune (trazioni, piegamenti, dip, australian row,
#                   squat, affondi, plank…). Sull'orologio compare il nome e conta le serie.
#   target_pace     "5:00" (±5 s) oppure un intervallo "5:30-5:15", in min/km
#   repeat          2–99 ripetizioni dei passi indicati sotto
#   note            testo che compare sul passo, anche sull'orologio

sessions:
  # ---- CORSA: ripetute 6 × 1 km --------------------------------------------------
  - date: 2026-11-04
    sport: running
    title: Ripetute 6×1 km
    description: Riscaldamento facile, 6 ripetute a ritmo soglia con 2' di recupero, defaticamento.
    priority: key
    steps:
      - type: warmup
        duration_type: time
        duration_value: 15
        target_pace: "6:15-5:50"
        note: Facile, ultimi 2' un po' più svelti
      - repeat: 6
        steps:
          - type: interval
            duration_type: distance
            duration_value: 1
            target_pace: "4:50-4:40"
            note: Ritmo soglia, controllato
          - type: recovery
            duration_type: time
            duration_value: 2
            note: Corsa lentissima o camminata
      - type: cooldown
        duration_type: time
        duration_value: 10
        target_pace: "6:30-6:00"

  # ---- CALISTHENICS: tirata e spinta al parchetto --------------------------------
  - date: 2026-11-05
    sport: calisthenics
    title: Parchetto · tirata e spinta
    description: Sbarra e parallele. 3 giri, recuperi completi. Senza sbarra, australian row su una barra bassa.
    priority: flexible
    steps:
      - type: warmup
        duration_type: time
        duration_value: 8
        note: Mobilità spalle e polsi, 10 scapular pull alla sbarra
      - repeat: 3
        steps:
          - type: interval
            exercise: trazioni
            reps: 6
            note: Presa prona, discesa lenta
          - type: rest
            duration_type: time
            duration_value: 1.5
          - type: interval
            exercise: dip alle parallele
            reps: 8
          - type: rest
            duration_type: time
            duration_value: 1.5
          - type: interval
            exercise: australian row
            reps: 10
          - type: rest
            duration_type: time
            duration_value: 1
          - type: interval
            exercise: piegamenti
            reps: 12
          - type: rest
            duration_type: time
            duration_value: 1.5
      - type: cooldown
        exercise: plank
        duration_type: time
        duration_value: 1
        note: Poi allungamento pettorali e dorsali
