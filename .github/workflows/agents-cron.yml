# Wakes the agents once a day. The API decides which agents are due (daily/weekly) and
# whether they may run at all (kill switch, budget) -- this job only knocks on the door.
#
# Render's free plan sleeps when idle, so the first request may take a minute to wake
# the service: hence the generous timeout and the retries.
#
# Needs two repository settings:
#   secrets.AGENTS_CRON_SECRET  -- same value as the API's AGENTS_CRON_SECRET env var
#   vars.PASSO_API_URL          -- the API's base URL, e.g. https://passo-api.onrender.com
name: agents-cron

on:
  schedule:
    - cron: "15 3 * * *" # 03:15 UTC, after the day's events are in
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger due agents
        env:
          API_URL: ${{ vars.PASSO_API_URL }}
          SECRET: ${{ secrets.AGENTS_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$SECRET" ]; then
            echo "PASSO_API_URL or AGENTS_CRON_SECRET not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/agents/cron" -H "x-cron-secret: $SECRET"
